<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your App Name</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #f3f6f1;
  --fg: #16231b;
  --muted: #55655a;
  --accent: #1f7a4d;
  --accent-fg: #ffffff;
  --line: #d3ddd4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121a15; --fg: #e8f0ea; --muted: #9db0a2; --accent: #4fc08a; --accent-fg: #0c1a12; --line: #2a3a2f;
  }
}
:root[data-theme="dark"] {
  --bg: #121a15; --fg: #e8f0ea; --muted: #9db0a2; --accent: #4fc08a; --accent-fg: #0c1a12; --line: #2a3a2f;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--fg);
  font-family: "Trebuchet MS", "Segoe UI", Roboto, sans-serif;
  line-height: 1.6;
}
main {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  max-width: 34rem;
  width: 100%;
  margin: 0 auto;
  padding: 3rem 1.5rem;
}
.icon {
  width: 5rem; height: 5rem;
  border-radius: 1.4rem;
  background: var(--accent);
  color: var(--accent-fg);
  display: grid; place-items: center;
  font-size: 2.2rem; font-weight: 700;
  margin-bottom: 1.75rem;
}
h1 { font-size: clamp(2.2rem, 8vw, 3.2rem); line-height: 1.1; margin: 0 0 1rem; letter-spacing: -0.02em; }
p.lede { font-size: 1.15rem; color: var(--muted); margin: 0 0 2rem; max-width: 30rem; }
.btn {
  align-self: flex-start;
  display: inline-block;
  background: var(--accent);
  color: var(--accent-fg);
  text-decoration: none;
  font-weight: 600;
  padding: 0.85rem 1.5rem;
  border-radius: 0.7rem;
}
.btn:hover { filter: brightness(1.08); }
a:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
footer {
  border-top: 1px solid var(--line);
  padding: 1.25rem 1.5rem;
  text-align: center;
  color: var(--muted);
  font-size: 0.95rem;
}
footer a { color: var(--fg); }
</style>
</head>
<body>
<main>
  <div class="icon" aria-hidden="true">A</div>
  <h1>Fair Share</h1>
  <p class="lede">Simple contribution calculator for household expenses.</p>
  <!-- <a class="btn" href="https://play.google.com/store/apps/details?id=com.example.yourapp">Get it on Google Play</a> -->
</main>
<footer>
  <a href="https://mslocombe.github.io/fair-share-pages/privacy">Privacy policy</a>
</footer>
</body>
</html>
